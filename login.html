<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign in — InsightFlow</title>
<link rel="icon" href="/assets/logo_icon.png">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FBF6FC;--card:#fff;--line:#EDE0F3;--ink:#22145C;--mut:#7A6C9E;--pri:#7C3AED;--pink:#EC4899;--tint:#F5EDFD;--err:#B91C1C;--errbg:#FEF2F2}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(900px 500px at 10% 0%,#F3E8FD,transparent),radial-gradient(800px 500px at 100% 100%,#FCE4F2,transparent),var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:14px}
button,input{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.wrap{width:100%;max-width:420px}
.logo{display:block;width:210px;max-width:70%;height:auto;margin:0 auto 18px;border-radius:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 30px rgba(124,58,237,.10);padding:26px}
h1{margin:0 0 4px;font-size:22px}.sub{margin:0 0 18px;color:var(--mut)}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--tint);border-radius:12px;padding:4px;margin-bottom:20px}
.tabs button{border:0;background:transparent;border-radius:9px;padding:9px;font-weight:600;color:var(--mut)}
.tabs button[aria-selected=true]{background:#fff;color:var(--pri);box-shadow:0 1px 4px rgba(124,58,237,.15)}
label{display:block;font-size:12px;font-weight:600;margin:0 0 5px}
.field{margin-bottom:14px}
.input{width:100%;background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px 13px}
.input:focus{border-color:var(--pri)}
.input.bad{border-color:var(--err)}
.pw{position:relative}.pw .input{padding-right:64px}
.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--pri);font-size:12px;font-weight:600;padding:6px 8px;border-radius:8px}
.msg{font-size:12px;color:var(--err);margin-top:4px;min-height:0}
.hint{font-size:12px;color:var(--mut);margin-top:4px}
.row{display:flex;justify-content:space-between;align-items:center;margin:2px 0 16px}
.row label{display:flex;gap:7px;align-items:center;margin:0;font-weight:500;cursor:pointer}
.btn{width:100%;background:var(--pri);color:#fff;border:0;border-radius:11px;padding:12px 16px;font-weight:700;transition:.15s}
.btn:hover{background:#6D28D9}.btn:active{transform:scale(.99)}.btn:disabled{opacity:.6;cursor:wait}
.alert{background:var(--errbg);color:var(--err);border:1px solid #FECACA;border-radius:11px;padding:10px 12px;margin-bottom:14px;font-size:13px}
.alert[hidden]{display:none}
.foot{text-align:center;color:var(--mut);margin-top:16px;font-size:12px}
[hidden]{display:none!important}
</style></head><body>
<main class="wrap">
  <img class="logo" src="/assets/logo_full.png" alt="InsightFlow">
  <div class="card">
    <div class="tabs" role="tablist" aria-label="Account">
      <button role="tab" id="t-login" aria-selected="true" aria-controls="f-login">Sign in</button>
      <button role="tab" id="t-reg" aria-selected="false" aria-controls="f-reg">Create account</button>
    </div>
    <div class="alert" id="err" role="alert" hidden></div>

    <form id="f-login" role="tabpanel" aria-labelledby="t-login" novalidate>
      <h1>Welcome back</h1><p class="sub">Sign in to continue to your dashboard.</p>
      <div class="field"><label for="l-id">Username or email</label><input class="input" id="l-id" name="identifier" autocomplete="username" required></div>
      <div class="field"><label for="l-pw">Password</label><div class="pw"><input class="input" id="l-pw" name="password" type="password" autocomplete="current-password" required><button type="button" data-show="l-pw" aria-label="Show password">Show</button></div></div>
      <div class="row"><label><input type="checkbox" id="l-rem"> Remember me for 30 days</label></div>
      <button class="btn" type="submit">Sign in</button>
    </form>

    <form id="f-reg" role="tabpanel" aria-labelledby="t-reg" novalidate hidden>
      <h1>Create your account</h1><p class="sub">It takes a few seconds.</p>
      <div class="field"><label for="r-un">Username</label><input class="input" id="r-un" name="username" autocomplete="username" maxlength="30" required><div class="msg" data-for="username"></div></div>
      <div class="field"><label for="r-em">Email</label><input class="input" id="r-em" name="email" type="email" autocomplete="email" required><div class="msg" data-for="email"></div></div>
      <div class="field"><label for="r-pw">Password</label><div class="pw"><input class="input" id="r-pw" name="password" type="password" autocomplete="new-password" required><button type="button" data-show="r-pw" aria-label="Show password">Show</button></div><div class="hint">At least 8 characters, with letters and numbers.</div><div class="msg" data-for="password"></div></div>
      <div class="field"><label for="r-cf">Confirm password</label><input class="input" id="r-cf" name="confirm" type="password" autocomplete="new-password" required><div class="msg" data-for="confirm"></div></div>
      <button class="btn" type="submit">Create account</button>
    </form>
  </div>
  <div class="foot">From Data to Insights — Powered by AI</div>
</main>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const err=$('#err');
function showErr(m){err.textContent=m;err.hidden=!m}
function tab(which){
  const reg=which==='reg';
  $('#t-login').setAttribute('aria-selected',!reg);$('#t-reg').setAttribute('aria-selected',reg);
  $('#f-login').hidden=reg;$('#f-reg').hidden=!reg;showErr('');clearFields();
  document.title=(reg?'Create account':'Sign in')+' — InsightFlow';
  history.replaceState(null,'',reg?'#register':'#');
  ($(reg?'#r-un':'#l-id')).focus();
}
function clearFields(){$$('.msg').forEach(m=>m.textContent='');$$('.input.bad').forEach(i=>i.classList.remove('bad'))}
$('#t-login').onclick=()=>tab('login');$('#t-reg').onclick=()=>tab('reg');
$$('[data-show]').forEach(b=>b.onclick=()=>{const i=$('#'+b.dataset.show),h=i.type==='password';i.type=h?'text':'password';b.textContent=h?'Hide':'Show';b.setAttribute('aria-label',h?'Hide password':'Show password')});

async function post(url,body){
  const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),credentials:'same-origin'});
  let j={};try{j=await r.json()}catch{}
  return{ok:r.ok,status:r.status,j};
}
function submitting(form,on){const b=form.querySelector('.btn');b.disabled=on;b.textContent=on?'Please wait…':(form.id==='f-login'?'Sign in':'Create account')}
const go=()=>{const n=new URLSearchParams(location.search).get('next');location.href=n&&n.startsWith('/')&&!n.startsWith('//')?n:'/'};

$('#f-login').onsubmit=async e=>{
  e.preventDefault();showErr('');
  const identifier=$('#l-id').value.trim(),password=$('#l-pw').value;
  if(!identifier||!password){showErr('Enter your username or email and your password.');return}
  submitting(e.target,true);
  try{
    const{ok,j}=await post('/api/login',{identifier,password,remember:$('#l-rem').checked});
    if(ok)return go();
    showErr(j.error||'Could not sign in.');
  }catch{showErr('Could not reach the server. Is it running?')}
  submitting(e.target,false);
};

$('#f-reg').onsubmit=async e=>{
  e.preventDefault();showErr('');clearFields();
  const body={username:$('#r-un').value.trim(),email:$('#r-em').value.trim(),password:$('#r-pw').value,confirm:$('#r-cf').value};
  const bad={};
  if(!/^[A-Za-z0-9_.]{3,30}$/.test(body.username))bad.username='3-30 characters: letters, numbers, dot or underscore.';
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(body.email))bad.email='Enter a valid email address.';
  if(body.password.length<8)bad.password='Password must be at least 8 characters.';
  else if(/^\d+$/.test(body.password)||/^[A-Za-z]+$/.test(body.password))bad.password='Use a mix of letters and numbers (or symbols).';
  if(body.confirm!==body.password)bad.confirm='Passwords do not match.';
  const field=n=>({username:'#r-un',email:'#r-em',password:'#r-pw',confirm:'#r-cf'})[n];
  const paint=f=>{for(const[k,v]of Object.entries(f)){const el=$(field(k));if(el){el.classList.add('bad');$(`.msg[data-for=${k}]`).textContent=v}}};
  if(Object.keys(bad).length){paint(bad);$(field(Object.keys(bad)[0])).focus();return}
  submitting(e.target,true);
  try{
    const{ok,j}=await post('/api/register',body);
    if(ok)return go();
    if(j.fields)paint(j.fields);else showErr(j.error||'Could not create the account.');
  }catch{showErr('Could not reach the server. Is it running?')}
  submitting(e.target,false);
};
if(location.hash==='#register')tab('reg');else $('#l-id').focus();
</script></body></html>
